# ─────────────────────────────────────────────────────────────
#  RVC Cluster Debug Tool — Configuration
# ─────────────────────────────────────────────────────────────
#  Copy this file to config.yaml and fill in your values.
#  Run: python -m env_validation_tool interactive
#       python -m env_validation_tool report -c config.yaml
# ─────────────────────────────────────────────────────────────

# ── Customer / Cluster Identification ──────────────────────
# Optional: appears in report headers to identify the cluster
customer: "Your Company — Cluster Name"

# ── ESXi Connection ─────────────────────────────────────────
# Comma-separated IP addresses of your ESXi hosts
esxi_ips: 192.168.1.10,192.168.1.11,192.168.1.12,192.168.1.13
esxi_user: root
esxi_pass: CHANGEME

# ── vCenter (optional) ──────────────────────────────────────
# If available, vCenter enables fuller alarm and task history.
# Leave blank to connect directly to ESXi hosts.
vcenter:
vcenter_user: administrator@vsphere.local
vcenter_pass: CHANGEME

# ── Discovery ───────────────────────────────────────────────
# Substring to match RVC VM names on each host (e.g. rvc, rubrik)
vm_pattern: rvc

# Comma-separated substrings to exclude from VM matching
vm_exclude: vcenter,vCenter

# Optional: filter hosts by server model substring
# host_model_filter: XR4510

# Optional: filter hosts by vCenter datacenter name
# datacenter: MyDatacenter

# ── Troubleshoot Settings ────────────────────────────────────
# How far back to collect performance metrics (minutes)
perf_interval: 60

# How far back to collect alarms, events, and tasks (days)
event_days: 7

# ── Output ──────────────────────────────────────────────────
output: /tool/out/report.json
output_pdf: /tool/out/report.pdf
output_xlsx: /tool/out/report.xlsx
